services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: estatepro
      MYSQL_USER: estatepro
      MYSQL_PASSWORD: ${DB_PASSWORD:-estatepro}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [estatepro]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: estatepro
      DB_USER: estatepro
      DB_PASSWORD: ${DB_PASSWORD:-estatepro}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [estatepro]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]
    networks: [estatepro]
networks:
  estatepro:
    driver: bridge
volumes:
  mysql_data: